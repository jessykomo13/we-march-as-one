# Compile le jeu avec Unity (WebGL) et le publie sur GitHub Pages à chaque push sur main.
name: Build Unity WebGL + GitHub Pages

# Lancement manuel uniquement (nécessite les secrets de licence Unity).
# La version web jouable est publiée depuis la branche gh-pages (dossier web/).
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Libérer de l'espace disque (image Unity volumineuse)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-WebGL-

      - name: Build Unity WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildName: WeMarchAsOne
          buildMethod: WMAO.EditorTools.WebBuild.BuildFromCI

      - name: Préparer le site
        run: |
          sudo chown -R $USER build
          touch build/WebGL/WeMarchAsOne/.nojekyll
          ls -la build/WebGL/WeMarchAsOne

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WeMarchAsOne

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

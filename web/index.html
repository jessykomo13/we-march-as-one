<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#cfe2ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="March as One">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>We March as One</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe2ee;color:#23262d;font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none}
.ui{position:fixed;z-index:2}
.scr{position:fixed;inset:0;z-index:5;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:#f2ead8}
button{font:inherit;font-weight:700;color:#23262d;background:#fffdf7;border:2px solid #23262d;border-radius:8px;padding:7px 11px;cursor:pointer;touch-action:manipulation;box-shadow:0 2px 0 #23262d}
button:active{transform:translateY(2px);box-shadow:none}
button.on{background:#23262d;color:#fffdf7}
button:disabled{opacity:.35}
button.go{background:#e5484d;color:#fff;border-color:#7a1d21;box-shadow:0 3px 0 #7a1d21;font-size:17px;letter-spacing:.06em;padding:10px 16px}
button.blue{background:#3b78e7;color:#fff;border-color:#1d3f7a;box-shadow:0 3px 0 #1d3f7a}
.seg{display:inline-flex}
.seg button{border-radius:0;margin-left:-2px}
.seg button:first-child{border-radius:8px 0 0 8px;margin-left:0}
.seg button:last-child{border-radius:0 8px 8px 0}
.panel{background:#fffdf7ee;border:2px solid #23262d;border-radius:12px;box-shadow:0 3px 0 #23262d}
.gold{color:#a77a06;font-weight:900}
.small{font-size:12px;color:#5b616d}
.red{color:#d8343a}.blue-t{color:#2c64cf}
#top{top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;pointer-events:none}
#top>*{pointer-events:auto}
.chip{font-weight:900;font-size:13px;background:#fffdf7ee;border:2px solid #23262d;border-radius:8px;padding:6px 9px;white-space:nowrap}
#top .title{max-width:42vw;overflow:hidden;text-overflow:ellipsis}
#top .sp{flex:1}
#cost.over{background:#e5484d;color:#fff}
#bottom{left:0;right:0;bottom:0;padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);display:flex;flex-direction:column;gap:6px;pointer-events:none}
#bottom>*{pointer-events:auto}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pal{display:flex;gap:5px;overflow-x:auto;padding:4px;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.slot{min-width:52px;padding:4px 5px 3px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px}
.slot svg{width:24px;height:24px}
.slot .n{font-weight:900;font-size:12px}
#bar{height:14px;border:2px solid #23262d;border-radius:7px;overflow:hidden;display:flex;min-width:120px;flex:1;background:#fffdf7}
#bar i{display:block;height:100%}
#toast{left:50%;top:calc(env(safe-area-inset-top) + 58px);transform:translateX(-50%);background:#23262d;color:#fffdf7;border-radius:10px;padding:8px 14px;max-width:90vw;text-align:center;transition:opacity .3s;pointer-events:none;opacity:0;z-index:9;font-weight:600}
h1.logo{font-size:clamp(36px,10vw,68px);line-height:.92;margin:0;letter-spacing:.01em;font-weight:900}
.wrap{max-width:940px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 14px calc(env(safe-area-inset-bottom) + 30px)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:18px}
.mode{text-align:left;padding:12px 14px;font-weight:600}
.mode b{display:block;font-size:17px;font-weight:900;margin-bottom:3px}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:12px}
.lv{padding:8px 6px;text-align:center;min-height:80px;display:flex;flex-direction:column;justify-content:space-between;gap:2px}
.lv .num{font-size:20px;font-weight:900}
.lv .nm{font-size:10px;font-weight:600;color:#5b616d}
.lv.boss{background:#ffe1dc}.lv.city{background:#ece4d2}
.lv .st{font-size:12px;letter-spacing:1px}
.off{opacity:.18}
.hdr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hdr .sp{flex:1}
.up{display:grid;grid-template-columns:1fr;gap:12px;margin-top:10px}
@media(min-width:820px){.up{grid-template-columns:1.5fr 1fr}}
.up>div{min-width:0}
svg.tree{width:100%;height:auto;display:block}
.node{cursor:pointer}
.rec{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed #c9bfa8}
.rec svg{width:28px;height:28px;flex:none}
.rec .info{flex:1}
#result{inset:0;display:flex;align-items:center;justify-content:center;background:#23262d77;z-index:6}
#result .panel{padding:18px;width:min(92vw,440px);text-align:center}
#result h2{font-size:40px;margin:2px 0 6px;font-weight:900}
.badges{display:flex;gap:8px;justify-content:center;margin:8px 0;flex-wrap:wrap}
.badge{border:2px solid #23262d;border-radius:20px;padding:4px 10px;font-weight:900;font-size:12px;opacity:.25}
.badge.got{opacity:1;background:#ffd84a}
.tbl{width:100%;margin:8px 0;border-collapse:collapse}
.tbl td{padding:3px 4px;text-align:left}.tbl td:last-child{text-align:right;font-weight:800}
.det{padding:10px 12px;margin-top:8px}
@media (max-height:520px){
  #bottom{flex-direction:row;flex-wrap:wrap;align-items:flex-end;gap:4px;padding-top:4px}
  #bottom button{padding:5px 8px;font-size:12px}
  #bottom button.go{font-size:14px;padding:7px 12px}
  .slot{min-width:42px;padding:2px 4px}.slot svg{width:18px;height:18px}
  .pal{padding:2px}
  #top{padding-top:calc(env(safe-area-inset-top) + 4px)}
  .chip{padding:4px 7px;font-size:12px}
  #top button{padding:4px 8px;font-size:12px}
}
[hidden]{display:none!important}
</style>
<script type="importmap">{ "imports": { "three": "./three.module.min.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="top" class="ui" hidden></div>
<div id="bottom" class="ui" hidden></div>
<div id="result" class="ui" hidden></div>
<div id="menu" class="scr" hidden></div>
<div id="levels" class="scr" hidden></div>
<div id="upgrades" class="scr" hidden></div>
<div id="toast" class="ui"></div>
<script type="module" src="js/game.js"></script>
</body>
</html>

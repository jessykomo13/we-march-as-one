<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icon-192.png">
<title>We March as One</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0d12;color:#e8eaf0;font:14px/1.3 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;display:block;touch-action:none}
.ui{position:fixed;z-index:2}
button{font:inherit;color:#e8eaf0;background:#232733;border:1px solid #343a4a;border-radius:9px;padding:7px 10px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
button.on{background:#2f6fe0;border-color:#4d8bff}
button.red.on{background:#c23b3b;border-color:#e05555}
button:disabled{opacity:.4}
button.big{font-weight:800;font-size:17px;padding:12px 16px;background:linear-gradient(#3d7cff,#2856c9);border-color:#5b8fff}
#top{top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 6px) 10px 6px;display:flex;gap:8px;align-items:center;background:linear-gradient(#0b0d12ee,#0b0d1200);pointer-events:none}
#top>*{pointer-events:auto}
@media (max-width:560px){#top h1{display:none}}
#top h1{font-size:15px;margin:0;letter-spacing:.06em;font-weight:900;color:#cfe0ff;white-space:nowrap}
#top .sp{flex:1}
#stats{font-size:12px;color:#9aa3b5;white-space:nowrap}
.gold{color:#ffd24a;font-weight:800}
.seg{display:inline-flex;border-radius:9px;overflow:hidden;border:1px solid #343a4a}
.seg button{border:0;border-radius:0;padding:6px 9px}
#sheet{left:0;right:0;bottom:0;background:#11141bf2;border-top:1px solid #2a2f3d;border-radius:14px 14px 0 0;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);max-height:52vh;display:flex;flex-direction:column}
#sheet.min #sheetBody{display:none}
#sheetHead{display:flex;gap:6px;align-items:center}
#sheetBody{overflow-y:auto;margin-top:8px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:5px 0}
.card{background:#1a1e28;border:1px solid #2a3040;border-radius:10px;padding:8px;margin:6px 0}
.card.dim{opacity:.5}
.lbl{font-weight:700}
.small{font-size:12px;color:#9aa3b5}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
input[type=range]{width:120px;accent-color:#4d8bff}
#hud{left:0;right:0;bottom:0;background:#11141bf2;border-top:1px solid #2a2f3d;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px)}
#hud .count{font-weight:800}
#result{inset:0;display:flex;align-items:center;justify-content:center;background:#000a}
#result .box{background:#141821;border:1px solid #2f3646;border-radius:16px;padding:20px;width:min(92vw,420px);text-align:center}
#result h2{font-size:32px;margin:4px 0 12px}
#toast{left:50%;top:calc(env(safe-area-inset-top) + 50px);transform:translateX(-50%);background:#1d2230;border:1px solid #33405a;border-radius:10px;padding:8px 14px;max-width:90vw;text-align:center;transition:opacity .3s;pointer-events:none;opacity:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top" class="ui">
  <h1>WE MARCH AS ONE</h1>
  <div class="seg" id="modeSeg"><button data-act="mode" data-v="0">Campagne</button><button data-act="mode" data-v="1">Sandbox</button></div>
  <span class="sp"></span>
  <span id="stats"></span>
</div>

<div id="sheet" class="ui"></div>
<div id="hud" class="ui" hidden></div>
<div id="result" class="ui" hidden><div class="box" id="resBox"></div></div>
<div id="toast" class="ui"></div>

<script>
"use strict";
// ======================================================================= données
const W = 160, H = 90, HW = W / 2, HH = H / 2, CELL = 2;
const GW = Math.ceil(W / CELL) + 1, GH = Math.ceil(H / CELL) + 1;
const MAX_UNITS = 30000, TIME_LIMIT = 300;
const T = [
  { n: 'Soldat',   sh: 'Carré',    hp: 10, dmg: 2,   range: .35, speed: 3,   cd: .7, size: .7,  cost: 1, rew: 1, enc: 1 },
  { n: 'Archer',   sh: 'Triangle', hp: 5,  dmg: 1.6, range: 11,  speed: 2.6, cd: 1.3, size: .75, cost: 3, rew: 2, enc: 3, ranged: 1, ps: 24 },
  { n: 'Bouclier', sh: 'Cercle',   hp: 45, dmg: 2.5, range: .35, speed: 1.8, cd: .9, size: 1.1, cost: 6, rew: 4, enc: 6 },
  { n: 'Cavalier', sh: 'Losange',  hp: 14, dmg: 3.5, range: .45, speed: 6.5, cd: .8, size: .95, cost: 5, rew: 3, enc: 9 },
];
const COL = [['#4d99ff', '#59e0ff', '#3861f2', '#998cff'], ['#ff524d', '#ff9e40', '#cc2938', '#ff66ad']];
const SK = [
  { id: 'sol_hp',     name: 'Armure des carrés',      desc: '+20% PV des Soldats',                              cost: 15,  g: 1.45, max: 10, d: 0, pre: [] },
  { id: 'unlock_shi', name: 'Recruter des Cercles',   desc: 'Débloque les Boucliers (très résistants)',         cost: 150, g: 1,    max: 1,  d: 1, pre: ['sol_hp'] },
  { id: 'shi_hp',     name: 'Remparts vivants',       desc: '+25% PV des Boucliers',                            cost: 60,  g: 1.5,  max: 8,  d: 2, pre: ['unlock_shi'] },
  { id: 'sol_dmg',    name: 'Lames affûtées',         desc: '+20% dégâts des Soldats',                          cost: 15,  g: 1.45, max: 10, d: 0, pre: [] },
  { id: 'unlock_cav', name: 'Recruter des Losanges',  desc: 'Débloque les Cavaliers (rapides, frappe forte)',   cost: 250, g: 1,    max: 1,  d: 1, pre: ['sol_dmg'] },
  { id: 'cav_dmg',    name: 'Charge',                 desc: '+20% dégâts des Cavaliers',                        cost: 80,  g: 1.5,  max: 8,  d: 2, pre: ['unlock_cav'] },
  { id: 'cav_spd',    name: 'Destriers',              desc: '+8% vitesse des Cavaliers',                        cost: 70,  g: 1.5,  max: 6,  d: 2, pre: ['unlock_cav'] },
  { id: 'rally',      name: 'Ralliement',             desc: 'Capacité : +70% vitesse. +durée par niveau',      cost: 200, g: 1.7,  max: 4,  d: 2, pre: ['unlock_cav'] },
  { id: 'unlock_arc', name: 'Recruter des Triangles', desc: 'Débloque les Archers (tir à distance)',            cost: 40,  g: 1,    max: 1,  d: 0, pre: [] },
  { id: 'arc_rate',   name: 'Cadence de tir',         desc: '+12% vitesse de tir des Archers',                  cost: 30,  g: 1.5,  max: 8,  d: 1, pre: ['unlock_arc'] },
  { id: 'arc_range',  name: 'Arcs longs',             desc: '+8% portée des Archers',                           cost: 35,  g: 1.5,  max: 6,  d: 1, pre: ['unlock_arc'] },
  { id: 'volley',     name: 'Pluie de flèches',       desc: 'Capacité : volée sur zone. +dégâts par niveau',   cost: 120, g: 1.7,  max: 5,  d: 1, pre: ['unlock_arc'] },
  { id: 'drill',      name: 'Discipline',             desc: '+6% PV de toutes les unités',                      cost: 300, g: 1.6,  max: 10, d: 3, pre: ['unlock_shi', 'unlock_arc'] },
  { id: 'drums',      name: 'Tambours de guerre',     desc: '+5% vitesse de toutes les unités',                 cost: 180, g: 1.6,  max: 6,  d: 4, pre: ['drill'] },
  { id: 'command',    name: 'Commandement',           desc: '+6% dégâts de toutes les unités',                  cost: 300, g: 1.6,  max: 10, d: 3, pre: ['unlock_cav', 'unlock_arc'] },
  { id: 'loot',       name: 'Pillage',                desc: "+12% d'or gagné",                                  cost: 50,  g: 1.6,  max: 10, d: 0, pre: [] },
];
const SKN = Object.fromEntries(SK.map(s => [s.id, s]));

// ======================================================================= sauvegarde
const KEY = 'wmao_web_v1', MAPKEY = 'wmao_web_map_v1';
let P = load();
function load() {
  let p = null;
  try { p = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  p = Object.assign({ gold: 0, level: 1, best: 1, roster: [20, 0, 0, 0], skill: {}, pl: [] }, p || {});
  return p;
}
const packPl = l => { const a = []; for (const p of l) a.push(+p.x.toFixed(2), +p.z.toFixed(2), p.t, p.o); return a; };
const unpackPl = (a, l) => { l.length = 0; if (!a) return; for (let i = 0; i + 3 < a.length; i += 4) l.push({ x: a[i], z: a[i + 1], t: a[i + 2], o: a[i + 3] }); };
function save() { P.pl = packPl(campP); try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} }

const lvl = id => P.skill[id] | 0;
const unlocked = t => t === 0 || lvl(['', 'unlock_arc', 'unlock_shi', 'unlock_cav'][t]) > 0;
const prereqOk = s => s.pre.every(p => lvl(p) > 0);
const skCost = s => Math.round(s.cost * Math.pow(s.g, lvl(s.id)));
const goldMul = () => 1 + .12 * lvl('loot');
function stats(t) {
  const b = T[t], s = { hp: b.hp, dmg: b.dmg, range: b.range, speed: b.speed, cd: b.cd, size: b.size, ranged: !!b.ranged, ps: b.ps || 0 };
  let hpM = 1 + .06 * lvl('drill'), dmM = 1 + .06 * lvl('command'), spM = 1 + .05 * lvl('drums');
  if (t === 0) { hpM *= 1 + .2 * lvl('sol_hp'); dmM *= 1 + .2 * lvl('sol_dmg'); }
  if (t === 1) { s.cd /= 1 + .12 * lvl('arc_rate'); s.range *= 1 + .08 * lvl('arc_range'); }
  if (t === 2) { hpM *= 1 + .25 * lvl('shi_hp'); }
  if (t === 3) { dmM *= 1 + .2 * lvl('cav_dmg'); spM *= 1 + .08 * lvl('cav_spd'); }
  s.hp *= hpM; s.dmg *= dmM; s.speed *= spM; return s;
}
const baseStats = t => { const b = T[t]; return { hp: b.hp, dmg: b.dmg, range: b.range, speed: b.speed, cd: b.cd, size: b.size, ranged: !!b.ranged, ps: b.ps || 0 }; };

// ======================================================================= état
let mode = 0; // 0 campagne, 1 bac à sable
let state = 'prep';
const campP = [], campE = [], sbP = [], sbE = [];
const PL = () => mode === 0 ? campP : sbP;
const EL = () => mode === 0 ? campE : sbE;
const placedP = [0, 0, 0, 0], placedE = [0, 0, 0, 0];
let brushT = 0, brushO = 0, erase = false, paintTeam = 0, brushSize = 4, density = 12, spawnAcc = 0;
let tab = 0, sheetMin = false;
let sim = null, speedIdx = 0, paused = false, volleyArmed = false, volleyReady = 0, rallyReady = 0;
let res = null;
const typeAllowed = t => mode === 0 ? unlocked(t) : (unlocked(t) || P.best >= T[t].enc);

function recount() {
  placedP.fill(0); placedE.fill(0);
  for (const p of PL()) placedP[p.t]++;
  for (const p of EL()) placedE[p.t]++;
}

// ======================================================================= formations
function block(list, team, cx, cz, n, t, o) {
  if (n <= 0) return;
  const sp = T[t].size * 1.05, maxW = Math.max(1, Math.floor((H - 6) / sp));
  let depth = Math.max(1, Math.ceil(Math.sqrt(n / 3)));
  const width = Math.min(maxW, Math.ceil(n / depth));
  const dir = team === 0 ? -1 : 1;
  for (let k = 0; k < n; k++) {
    const r = Math.floor(k / width), c = k % width;
    let x = cx + dir * r * sp, z = cz + (c - (width - 1) / 2) * sp;
    x = team === 0 ? clamp(x, -HW + 1.5, -3.5) : clamp(x, 3.5, HW - 1.5);
    z = clamp(z, -HH + 1.5, HH - 1.5);
    list.push({ x, z, t, o });
  }
}
function autoPlace(list, team, useRoster) {
  const have = [0, 0, 0, 0]; for (const p of list) have[p.t]++;
  const s = team === 0 ? -1 : 1;
  for (let t = 0; t < 4; t++) {
    if (!typeAllowed(t)) continue;
    const n = useRoster ? P.roster[t] - have[t] : (t === brushT ? 1000 : 0);
    if (n <= 0) continue;
    if (t === 2) block(list, team, s * 8, 0, n, t, 0);
    else if (t === 0) block(list, team, s * 12, 0, n, t, 0);
    else if (t === 3) { block(list, team, s * 14, 26, n >> 1, t, 0); block(list, team, s * 14, -26, n - (n >> 1), t, 0); }
    else block(list, team, s * 30, 0, n, t, 1);
  }
  recount();
}
function rngFrom(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function genEnemy(L) {
  campE.length = 0;
  const r = rngFrom(L * 7919 + 13);
  const total = Math.round(15 * Math.pow(1.28, L - 1));
  const w = [1, L >= 3 ? .4 : 0, L >= 6 ? .18 : 0, L >= 9 ? .25 : 0], sum = w.reduce((a, b) => a + b);
  for (let t = 0; t < 4; t++) {
    const n = Math.round(total * w[t] / sum); if (n <= 0) continue;
    const parts = 1 + Math.floor(r() * Math.min(3, 1 + (L >> 2)));
    for (let k = 0; k < parts; k++) {
      const pn = k === parts - 1 ? n - Math.floor(n / parts) * (parts - 1) : Math.floor(n / parts);
      let cz = r() * 50 - 25, cx;
      if (t === 2) cx = 6 + r() * 4;
      else if (t === 3) { cx = 14 + r() * 10; cz = (k % 2 ? -1 : 1) * (20 + r() * 15); }
      else if (t === 1) cx = 30 + r() * 10;
      else cx = 10 + r() * 8;
      const o = (t === 1 || (L > 4 && r() < .2)) ? 1 : 0;
      block(campE, 1, cx, cz, pn, t, o);
    }
  }
  recount();
}
function demoSandbox() { sbP.length = 0; sbE.length = 0; block(sbP, 0, -10, 0, 2500, 0, 0); block(sbE, 1, 10, 0, 3000, 0, 0); }

// ======================================================================= simulation
class Sim {
  constructor(cap) {
    this.cap = Math.max(1, cap); this.n = 0;
    const F = () => new Float32Array(this.cap);
    this.x = F(); this.z = F(); this.hx = F(); this.hz = F(); this.hp = F(); this.cd = F(); this.dmg = F(); this.range = F();
    this.speed = F(); this.cool = F(); this.size = F(); this.ps = F(); this.rew = F(); this.deathT = F();
    this.team = new Uint8Array(this.cap); this.type = new Uint8Array(this.cap); this.order = new Uint8Array(this.cap);
    this.alive = new Uint8Array(this.cap); this.ranged = new Uint8Array(this.cap);
    this.target = new Int32Array(this.cap); this.wait = new Int32Array(this.cap); this.next = new Int32Array(this.cap);
    this.head = new Int32Array(GW * GH);
    this.aliveC = [0, 0]; this.startC = [0, 0]; this.gold = 0; this.time = 0; this.buff = [1, 1]; this.rallyT = 0;
    this.finished = false; this.winner = -1; this.cen = [[0, 0], [0, 0]];
    const PC = 40000; this.PC = PC; this.pn = 0;
    this.px = new Float32Array(PC); this.pz = new Float32Array(PC); this.tx = new Float32Array(PC); this.tz = new Float32Array(PC);
    this.pd = new Float32Array(PC); this.pspd = new Float32Array(PC); this.parea = new Float32Array(PC); this.pd0 = new Float32Array(PC); this.parc = new Float32Array(PC);
    this.ptgt = new Int32Array(PC); this.pteam = new Uint8Array(PC);
  }
  add(x, z, t, o, tm, s, rew) {
    if (this.n >= this.cap) return; const i = this.n++;
    this.x[i] = x; this.z[i] = z; this.hx[i] = tm === 0 ? 1 : -1; this.hz[i] = 0;
    this.hp[i] = s.hp; this.cd[i] = Math.random() * s.cd; this.dmg[i] = s.dmg; this.range[i] = s.range;
    this.speed[i] = s.speed * (.92 + .16 * Math.random()); this.cool[i] = s.cd; this.size[i] = s.size;
    this.ranged[i] = s.ranged ? 1 : 0; this.ps[i] = s.ps; this.rew[i] = rew;
    this.team[i] = tm; this.type[i] = t; this.order[i] = o; this.alive[i] = 1; this.target[i] = -1; this.wait[i] = i % 8;
    this.aliveC[tm]++; this.startC[tm]++;
  }
  cx(x) { const c = ((x + HW) / CELL) | 0; return c < 0 ? 0 : c >= GW ? GW - 1 : c; }
  cz(z) { const c = ((z + HH) / CELL) | 0; return c < 0 ? 0 : c >= GH ? GH - 1 : c; }
  grid() {
    this.head.fill(-1);
    for (let i = 0; i < this.n; i++) { if (!this.alive[i]) continue; const c = this.cz(this.z[i]) * GW + this.cx(this.x[i]); this.next[i] = this.head[c]; this.head[c] = i; }
  }
  centroids() {
    let a = 0, b = 0, c = 0, d = 0, n0 = 0, n1 = 0;
    for (let i = 0; i < this.n; i++) { if (!this.alive[i]) continue; if (this.team[i] === 0) { a += this.x[i]; b += this.z[i]; n0++; } else { c += this.x[i]; d += this.z[i]; n1++; } }
    if (n0) this.cen[0] = [a / n0, b / n0]; if (n1) this.cen[1] = [c / n1, d / n1];
  }
  step(dt) {
    if (this.finished) return;
    this.time += dt;
    if (this.rallyT > 0) { this.rallyT -= dt; if (this.rallyT <= 0) this.buff[0] = 1; }
    this.grid(); this.centroids();
    for (let i = 0; i < this.n; i++) if (this.alive[i]) this.unit(i, dt);
    this.separate(); this.projectiles(dt);
    if (this.aliveC[0] <= 0 || this.aliveC[1] <= 0) { this.finished = true; this.winner = this.aliveC[0] > 0 ? 0 : 1; }
    else if (this.time >= TIME_LIMIT) { this.finished = true; this.winner = this.aliveC[0] / this.startC[0] > this.aliveC[1] / this.startC[1] ? 0 : 1; }
  }
  find(i, maxR) {
    const cx = this.cx(this.x[i]), cz = this.cz(this.z[i]), rings = Math.ceil(maxR / CELL), my = this.team[i];
    const xi = this.x[i], zi = this.z[i], head = this.head, next = this.next, X = this.x, Z = this.z, TM = this.team, AL = this.alive;
    let best = -1, bd = maxR * maxR;
    for (let r = 0; r <= rings; r++) {
      for (let dz = -r; dz <= r; dz++) {
        const gz = cz + dz; if (gz < 0 || gz >= GH) continue;
        const edge = dz === -r || dz === r; const st = edge || r === 0 ? 1 : 2 * r;
        for (let dx = -r; dx <= r; dx += st) {
          const gx = cx + dx; if (gx < 0 || gx >= GW) continue;
          for (let j = head[gz * GW + gx]; j !== -1; j = next[j]) {
            if (TM[j] === my || !AL[j]) continue;
            const a = X[j] - xi, b = Z[j] - zi, d = a * a + b * b; if (d < bd) { bd = d; best = j; }
          }
        }
      }
      const rd = r * CELL; if (best !== -1 && bd <= rd * rd) break;
    }
    return best;
  }
  unit(i, dt) {
    this.cd[i] -= dt;
    let t = this.target[i];
    const lost = t >= 0 && !this.alive[t]; if (lost) t = -1;
    if (lost || --this.wait[i] <= 0) {
      const r = this.order[i] === 1 ? Math.max(this.range[i] + 4, 8) : Math.max(this.range[i] + 2, 16);
      t = this.find(i, r); this.wait[i] = t >= 0 ? 6 + (i & 3) : 10 + (i & 7);
    }
    this.target[i] = t;
    const spd = this.speed[i] * this.buff[this.team[i]];
    let mx = 0, mz = 0;
    if (t >= 0) {
      const dx = this.x[t] - this.x[i], dz = this.z[t] - this.z[i], d = Math.sqrt(dx * dx + dz * dz) + 1e-5;
      const reach = this.range[i] + (this.size[i] + this.size[t]) * .5;
      this.hx[i] = dx / d; this.hz[i] = dz / d;
      if (d <= reach) {
        if (this.cd[i] <= 0) { this.cd[i] = this.cool[i]; if (this.ranged[i]) this.fire(i, t); else this.damage(t, this.dmg[i], this.team[i]); }
      } else { mx = this.hx[i]; mz = this.hz[i]; }
    } else if (this.order[i] === 0) {
      const et = 1 - this.team[i];
      if (this.aliveC[et] > 0) {
        const dx = this.cen[et][0] - this.x[i], dz = (this.cen[et][1] - this.z[i]) * .35, d = Math.sqrt(dx * dx + dz * dz);
        if (d > .5) { mx = dx / d; mz = dz / d; this.hx[i] = mx; this.hz[i] = mz; }
      }
    }
    if (mx || mz) { this.x[i] += mx * spd * dt; this.z[i] += mz * spd * dt; }
  }
  separate() {
    const hw = HW - .3, hh = HH - .3, X = this.x, Z = this.z, S = this.size, AL = this.alive, head = this.head, next = this.next;
    for (let i = 0; i < this.n; i++) {
      if (!AL[i]) continue;
      const cx = this.cx(X[i]), cz = this.cz(Z[i]); let checks = 0, ox = 0, oz = 0; const si = S[i];
      for (let gz = cz - 1; gz <= cz + 1 && checks < 12; gz++) {
        if (gz < 0 || gz >= GH) continue;
        for (let gx = cx - 1; gx <= cx + 1 && checks < 12; gx++) {

// ======================================================================= caméra & rendu
const cv = document.getElementById('c'), ctx = cv.getContext('2d', { alpha: false });

}
function fitCam() {

}
// écran -> monde
const wx = (px, py) => ROT ? cam.x - (py - VH / 2) / cam.s : (px - VW / 2) / cam.s + cam.x;

function drawShapes(n, getX, getZ, getHX, getHZ, getS, filterTeam, filterType) {

let mouse = { x: -1, y: -1, in: false };
function render() {

  ctx.fillStyle = '#2b1b1d'; ctx.fillRect(0, -HH, HW, H);
  ctx.fillStyle = '#4a4f5c'; ctx.fillRect(-.12, -HH, .24, H);

  if (sim && state !== 'prep') {
    const S = sim, n = S.n;
    // morts récents

    for (let i = 0; i < n; i++) if (!S.alive[i] && S.time - S.deathT[i] < 3) { const h = S.size[i] * .35; ctx.rect(S.x[i] - h, S.z[i] - h, h * 2, h * 2); }

}

// ======================================================================= entrées
const keys = new Set();
addEventListener('keydown', e => {
  keys.add(e.key.toLowerCase());

  if (state === 'prep' && '1234'.includes(e.key)) selectBrush(+e.key - 1);
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));

const ptrs = new Map(); let gesture = null, painting = false, paintErase = false, panning = false;
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (ptrs.size === 1) {
    if (e.button === 1) panning = true;
    else if (state === 'prep') { painting = true; paintErase = e.button === 2; spawnAcc = 0; paintAt(1 / 60); }
    else if (state === 'battle' && volleyArmed && e.button === 0) fireVolley(wx(e.clientX, e.clientY), wz(e.clientX, e.clientY));

}
let uiDirty = false;
function paintAt(dt) {

// ======================================================================= bataille
function startBattle() {

    h += `<div class="card"><div class="lbl">${sw(0, t)}${T[t].sh} · ${T[t].n} <span class="small">${camp ? `${placedP[t]} / ${P.roster[t]} placés` : `bleus ${placedP[t]} · rouges ${placedE[t]}`}</span></div>`;
    if (camp) {
      h += `<div class="row">`;
      for (const a of [10, 100, 1000]) { const c = a * T[t].cost; h += `<button data-act="buy" data-t="${t}" data-v="${a}" ${P.gold < c ? 'disabled' : ''}>+${a} (${fmt(c)} or)</button>`; }
      h += `</div>`;
    }
    h += `</div>`;
  }
  return h;
}
function buildHud() {
  if (!sim) return;
  const r = (cond, lbl) => cond;
  const vReady = sim.time >= volleyReady, rReady = sim.time >= rallyReady;
  let h = `<div class="row"><span class="count" style="color:${COL[0][0]}" id="cB"></span><span class="count" style="color:${COL[1][0]}" id="cR"></span><span class="small" id="cT"></span><span style="flex:1"></span><button data-act="quit">Abandonner</button></div>`;
  h += `<div class="row"><div class="seg">${[1, 2, 4, 8].map((v, i) => `<button data-act="speed" data-v="${i}" class="${speedIdx === i ? 'on' : ''}">x${v}</button>`).join('')}</div>`;
  h += `<button data-act="pause" class="${paused ? 'on' : ''}">${paused ? '▶ Reprendre' : '⏸ Pause'}</button></div>`;
  h += `<div class="row"><button data-act="allorder" data-v="0">Tous : MARCHE</button><button data-act="allorder" data-v="1">Tous : TENIR</button>`;
  h += volleyLvl() > 0 ? `<button data-act="volley" id="bV" class="${volleyArmed ? 'on' : ''}" ${vReady ? '' : 'disabled'}></button>` : `<span class="small">Pluie : à débloquer</span>`;
  h += rallyLvl() > 0 ? `<button data-act="rally" id="bR" ${rReady ? '' : 'disabled'}></button>` : `<span class="small">Ralliement : à débloquer</span>`;
  h += `</div>`;
  $('#hud').innerHTML = h; updateHud();
}
function updateHud() {
  if (!sim) return;
  $('#cB').textContent = `Bleus ${fmt(sim.aliveC[0])}/${fmt(sim.startC[0])}`;
  $('#cR').textContent = `Rouges ${fmt(sim.aliveC[1])}/${fmt(sim.startC[1])}`;
  $('#cT').textContent = (mode === 0 ? `+${fmt(sim.gold)} or · ` : '') + `${sim.time | 0} s`;
  const bV = $('#bV'), bR = $('#bR');
  if (bV) { const ready = sim.time >= volleyReady; bV.disabled = !ready; bV.textContent = volleyArmed ? '🎯 Touche la carte…' : ready ? '🏹 Pluie de flèches' : `🏹 ${Math.ceil(volleyReady - sim.time)} s`; }
  if (bR) { const ready = sim.time >= rallyReady; bR.disabled = !ready; bR.textContent = ready ? '🚩 Ralliement' : `🚩 ${Math.ceil(rallyReady - sim.time)} s`; }
}
function buildResult() {
  const camp = mode === 0, w = res.win;
  let h = `<h2 style="color:${w ? '#6fb4ff' : '#ff6a5a'}">${camp ? (w ? 'VICTOIRE !' : 'DÉFAITE') : (w ? 'VICTOIRE BLEUE' : 'VICTOIRE ROUGE')}</h2>`;
  h += `<p>Ennemis éliminés : <b>${fmt(res.killed)}</b><br>Pertes : <b>${fmt(res.lost)}</b> <span class="small">(elles reviennent pour la prochaine bataille)</span></p>`;
  if (camp) h += `<p class="gold">Or gagné : ${fmt(res.gold)}${res.bonus ? ' + bonus ' + fmt(res.bonus) : ''}</p><p class="small">${w ? 'Prochaine : bataille ' + P.level : 'Recrute et améliore ton armée, puis réessaie.'}</p>`;
  h += `<button class="big" data-act="continue" style="width:100%">${camp ? 'Continuer' : "Retour à l'éditeur"}</button>`;
  $('#resBox').innerHTML = h;
}

document.addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const v = b.dataset.v, act = b.dataset.act;
  switch (act) {
    case 'mode': if (state === 'prep') { mode = +v; tab = 0; erase = false; paintTeam = 0; recount(); fitCam(); } break;
    case 'tab': tab = +v; sheetMin = false; break;
    case 'min': sheetMin = !sheetMin; break;
    case 'battle': startBattle(); return;
    case 'brush': brushT = +v; erase = false; break;
    case 'order': brushO = +v; break;
    case 'erase': erase = v === '1'; break;
    case 'team': paintTeam = +v; break;
    case 'auto': { const team = mode === 0 ? 0 : paintTeam; autoPlace(team === 0 ? PL() : EL(), team, mode === 0); break; }
    case 'clear': { const team = mode === 0 ? 0 : paintTeam; (team === 0 ? PL() : EL()).length = 0; recount(); break; }
    case 'savemap': try { localStorage.setItem(MAPKEY, JSON.stringify({ a: packPl(sbP), b: packPl(sbE) })); toast('Carte sauvegardée.'); } catch (er) { toast('Impossible de sauvegarder.'); } break;
    case 'loadmap': { let m = null; try { m = JSON.parse(localStorage.getItem(MAPKEY)); } catch (er) {} if (m) { unpackPl(m.a, sbP); unpackPl(m.b, sbE); recount(); toast('Carte chargée.'); } else toast('Aucune carte sauvegardée.'); break; }
    case 'demo': demoSandbox(); recount(); break;
    case 'buy': { const t = +b.dataset.t, a = +v, c = a * T[t].cost; if (P.gold >= c) { P.gold -= c; P.roster[t] += a; save(); } break; }
    case 'skill': { const s = SKN[v]; const c = skCost(s); if (P.gold >= c && lvl(s.id) < s.max && prereqOk(s)) { P.gold -= c; P.skill[s.id] = lvl(s.id) + 1; save(); } break; }
    case 'speed': speedIdx = +v; buildHud(); return;
    case 'pause': paused = !paused; buildHud(); return;
    case 'allorder': sim.setOrder(0, +v); toast(+v ? 'Toute l\'armée TIENT sa position.' : 'Toute l\'armée MARCHE !'); return;
    case 'volley': volleyArmed = !volleyArmed; if (volleyArmed) toast('Touche la zone à bombarder.'); updateHud(); b.classList.toggle('on', volleyArmed); return;
    case 'rally': sim.rally(4 + 1.5 * rallyLvl()); rallyReady = sim.time + 20; updateHud(); return;
    case 'quit': sim.finished = true; sim.winner = 1; return;
    case 'continue': continueAfter(); return;
  }
  renderUI();
});

// ======================================================================= boucle
let last = performance.now(), uiT = 0;
function loop(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  // clavier
  let mx = 0, mz = 0;
  if (keys.has('z') || keys.has('w') || keys.has('arrowup')) mz -= 1;
  if (keys.has('s') || keys.has('arrowdown')) mz += 1;
  if (keys.has('q') || keys.has('a') || keys.has('arrowleft')) mx -= 1;
  if (keys.has('d') || keys.has('arrowright')) mx += 1;
  if (mx || mz) { const sp = 500 * dt * (keys.has('shift') ? 2.5 : 1); panScreen(-mx * sp, -mz * sp); }

  if (state === 'prep' && painting && ptrs.size === 1) paintAt(dt);
  if (state === 'battle' && sim) {
    if (!paused) { const steps = [1, 2, 4, 8][speedIdx], sdt = Math.min(dt, 1 / 30); for (let s = 0; s < steps && !sim.finished; s++) sim.step(sdt); }
    if (sim.finished) endBattle();
  }
  uiT -= dt;
  if (uiT <= 0) {
    uiT = .2;
    updateStats();
    if (state === 'battle') updateHud();
    if (state === 'prep' && uiDirty) { uiDirty = false; const r = $('#roster'); if (r) r.innerHTML = rosterHtml(); }
  }
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('#toast').style.opacity = 0; }
  render();
  requestAnimationFrame(loop);
}

// ======================================================================= démarrage
addEventListener('resize', () => { const was = ROT; resize(); if ((VH > VW * 1.1) !== was) fitCam(); });
resize(); fitCam();
unpackPl(P.pl, campP);
{ // retire les placements qui dépassent la réserve
  const c = [0, 0, 0, 0];
  for (let i = campP.length - 1; i >= 0; i--) { const p = campP[i]; if (p.t > 3 || !unlocked(p.t) || ++c[p.t] > P.roster[p.t]) campP.splice(i, 1); }
}
if (!campP.length) autoPlace(campP, 0, true);
genEnemy(P.level);
{ let m = null; try { m = JSON.parse(localStorage.getItem(MAPKEY)); } catch (e) {} if (m) { unpackPl(m.a, sbP); unpackPl(m.b, sbE); } else demoSandbox(); }
recount(); renderUI();
toast('Peins tes troupes sur la moitié bleue, puis lance la BATAILLE !');
requestAnimationFrame(loop);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
